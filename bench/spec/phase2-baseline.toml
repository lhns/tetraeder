# Bands are not used by info pairs but every device needs one (same values as phase0).
[[noise_band]]
class = "cuda-default"
device = "cuda"
band = 0.08

[[noise_band]]
class = "rtx-4090"
device = "cuda"
gpu_match = "4090"
band = 0.05

[[noise_band]]
class = "rtx-3090"
device = "cuda"
gpu_match = "3090"
band = 0.05
