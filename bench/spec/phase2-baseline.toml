# ~35 s per invocation
[[variant]]
id = "p2-full-ub2048-pp32k"
engine = "llama-bench"
model = "moe"
device = "cuda"
args = ["-ngl", "99", "-fa", "1", "-b", "2048", "-ub", "2048", "-p", "32768"]

# ~76 s per invocation
[[variant]]
id = "p2-ot-all-experts-ub512"
