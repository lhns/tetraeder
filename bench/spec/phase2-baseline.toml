# Pairs: a is the reference, b the changed setting; ratio = b / a

[[pair]]
id = "info-full-ub1024-vs-512"
a = "p2-full-ub512"
b = "p2-full-ub1024"
role = "info"

[[pair]]
id = "info-full-ub2048-vs-512"
