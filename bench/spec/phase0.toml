# Phase 0/1 benchmark spec, run nightly on a Vast box by scripts/nightly.sh.
#   tetraeder-bench run bench/spec/phase0.toml
# Rules (AGENTS.md "Benchmark comparability on Vast"): clocks cannot be locked in a container and the host changes
# nightly, so every comparison is paired (A, B, A, B ... in one session) and gated on the paired ratio.
# Absolute tok/s are recorded but never compared across nights.

[spec]
name = "phase0"
description = "llama.cpp baseline (CPU, CUDA, MoE with expert-offload overrides) plus the Tetraeder slot"
repeats = 5               # interleaved A,B pairs per spec pair
warmup = 1                # discarded A,B invocations; loads the model into the page cache
page_cache = "warm"       # warm: files stay cached after warmup; cold needs root and drops caches before every sample
bootstrap_resamples = 10000
confidence = 0.95
seed = 20240601

[pins]
# Commits the binaries must come from; the harness records the build_commit llama-bench reports next to these.
llama_cpp = "2e0d86bebc210947680e8f0d67daa79f3260c106"   # vendor/llama.cpp submodule
ik_llama_cpp = "pending"                                # baseline added when its exit test needs it
tetraeder = "HEAD"                                      # recorded as env.git_commit

[workload]
batch = 2048
ubatch = 512
prompt_len = 512
gen_len = 64
# threads: omitted. The harness passes the same explicit -t to both engines for every variant: the harness host's
# available_parallelism() (cgroup quota aware), or `threads = N` on a variant. llama-bench's own default (one per
# physical core, about 40 on the 80-CPU box) exceeds the container quota (about 11) and made CPU numbers meaningless.

[model.dense]
hf = "Qwen/Qwen3-8B-GGUF:Qwen3-8B-Q4_K_M.gguf"
note = "about 5 GB; fits any nightly GPU"

[model.moe]
hf = "Qwen/Qwen3-30B-A3B-GGUF:Qwen3-30B-A3B-Q4_K_M.gguf"
note = "about 18.6 GB, 48 layers; needs a 24 GB card for the full-GPU variant and 20 GB RAM for the CPU variants"

[[engine]]
id = "llama-bench"
kind = "llama-bench"
bin_env = "LLAMA_BENCH"
bin = "/opt/llama.cpp/bin/llama-bench"

[[engine]]
id = "tetraeder"
kind = "tetraeder"
bin_env = "TETRAEDER_BIN"
bin = "target/release/tetraeder"
note = "`tetraeder bench`: llama-bench's pp/tg loops through the libllama engine (ADR 0026)"

# Variant args may replace the workload's -p and -r (the harness defaults to -r 1 and repeats itself). CUDA variants
# use -p 2048 -r 3: a pp512 run takes about 0.1 s and was noisy; both engines get the same flags.
# CPU variants run with CUDA_VISIBLE_DEVICES and GGML_VK_VISIBLE_DEVICES empty, so prompts do not leave for the GPU.

# llama.cpp, dense
[[variant]]
id = "llama-cpu-dense"
engine = "llama-bench"
model = "dense"
device = "cpu"
args = ["-ngl", "0"]

[[variant]]
id = "llama-cuda-dense"
engine = "llama-bench"
model = "dense"
device = "cuda"
args = ["-ngl", "99", "-p", "2048", "-r", "3"]

# llama.cpp, MoE: plain, and with expert-offload tensor overrides (-ot <regex>=<buffer type>)
[[variant]]
id = "llama-cpu-moe"
engine = "llama-bench"
model = "moe"
device = "cpu"
args = ["-ngl", "0"]

[[variant]]
id = "llama-cuda-moe-full"
engine = "llama-bench"
model = "moe"
device = "cuda"
args = ["-ngl", "99", "-p", "2048", "-r", "3"]

[[variant]]
id = "llama-cuda-moe-ot-all-experts"
engine = "llama-bench"
model = "moe"
device = "cuda"
args = ["-ngl", "99", "-ot", "exps=CPU", "-p", "2048", "-r", "3"]

[[variant]]
id = "llama-cuda-moe-ot-upper-half"
engine = "llama-bench"
model = "moe"
device = "cuda"
# experts of layers 24..47 stay in RAM
args = ["-ngl", "99", "-ot", 'blk\.(2[4-9]|3[0-9]|4[0-7])\.ffn_(up|down|gate)_exps=CPU', "-p", "2048", "-r", "3"]

# Tetraeder: same placement as its baseline; telemetry on (production mode) unless stated
[[variant]]
id = "tetraeder-cpu-dense"
engine = "tetraeder"
model = "dense"
device = "cpu"
args = ["--ngl", "0"]

[[variant]]
id = "tetraeder-cuda-dense"
engine = "tetraeder"
model = "dense"
device = "cuda"
args = ["--ngl", "99", "-p", "2048", "-r", "3"]

[[variant]]
id = "tetraeder-cuda-dense-telemetry-off"
engine = "tetraeder"
model = "dense"
device = "cuda"
args = ["--ngl", "99", "--telemetry", "off", "-p", "2048", "-r", "3"]

# A/A pairs measure the noise of this box in this session
# Pairs run in file order: GPU pairs first, so the slow CPU pairs cannot push the Phase 1 GPU exit test past
# the bench time limit.
[[pair]]
id = "noise-cuda-dense"
a = "llama-cuda-dense"
b = "llama-cuda-dense"
role = "noise"

# Phase 1 exit test: Tetraeder within 5% of llama.cpp at the same parameters
[[pair]]
id = "gate-tetraeder-cuda-dense"
a = "llama-cuda-dense"
b = "tetraeder-cuda-dense"
role = "gate"

# Phase 1 exit test: production telemetry overhead under 2%. Reported, not gated, until a band below the box noise
# is measured (ADR 0026).
[[pair]]
id = "info-tetraeder-telemetry-overhead"
a = "tetraeder-cuda-dense-telemetry-off"
b = "tetraeder-cuda-dense"
role = "info"

# What expert offload costs on this box (reported, not gated)
[[pair]]
id = "info-cuda-moe-ot-all-experts"
a = "llama-cuda-moe-full"
b = "llama-cuda-moe-ot-all-experts"
role = "info"

[[pair]]
id = "info-cuda-moe-ot-upper-half"
a = "llama-cuda-moe-full"
b = "llama-cuda-moe-ot-upper-half"
role = "info"

[[pair]]
id = "noise-cpu-dense"
a = "llama-cpu-dense"
b = "llama-cpu-dense"
role = "noise"

# Phase 1 exit test: Tetraeder within 5% of llama.cpp at the same parameters
[[pair]]
id = "gate-tetraeder-cpu-dense"
a = "llama-cpu-dense"
b = "tetraeder-cpu-dense"
role = "gate"

[[pair]]
id = "noise-cpu-moe"
a = "llama-cpu-moe"
b = "llama-cpu-moe"
role = "noise"

# Allowed drop of the paired ratio per device and GPU class. PROVISIONAL: replace with bands measured from the
# noise-* pairs over several nights on each class (p95 of |ratio - 1| plus margin).
[[noise_band]]
class = "cpu"
device = "cpu"
band = 0.10

[[noise_band]]
class = "cuda-default"
device = "cuda"
band = 0.08

[[noise_band]]
class = "rtx-4090"
device = "cuda"
gpu_match = "4090"
band = 0.05

[[noise_band]]
class = "rtx-3090"
device = "cuda"
gpu_match = "3090"
band = 0.05
