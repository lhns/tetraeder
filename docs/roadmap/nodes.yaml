  folded: []
  overview: false
  plain: One 3090 box under the 64 GB balloon ran the 47-layer exit segment with 32 VRAM and 96 RAM slots on real hidden-state input, calibrated on truncated anchors and predicted before measuring. The routing gate held and the medians of three rounds would be within 15% (e_pp +0.077, e_tg -0.044), but the session is not clean (A/A -0.099 against the band 0.08) and prefill of identical rounds spans 45 to 384 tok/s (8.6x, threads unpinned on a two-socket host; the eight-round median is e_pp -0.17), so there is no verdict and the confirmation reruns after thread and memory placement is settled.
