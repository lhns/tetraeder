  overview: false
  plain: On CUDA the parity suite fails 4 libllama-engine cases that pass on CPU (repeat-penalty, seeded-sampler-names, logprobs, logprobs-shape); the same prompt gives tetraeder different logprobs between runs (-1.8332 and -1.8114 against llama-server's -1.8150 both times), so batch or reuse state changes CUDA numerics.
  notes: 'Found by bench-regression-gate on an A100. First check whether prefix reuse or batch composition differs from llama-server for these cases, then whether llama-server itself is run-to-run stable on CUDA; the conformance tolerance for CUDA may need a stated band (ADR 0083 decision 2 says CUDA and CPU). Diagnosed 2026-11-24 (stream-predict-20261124, A40, correctness only) - the 4 cases fail in the suite twice and pass with prefix reuse and the prompt caches off (tetraeder --no-prefix-reuse --cache-ram 0, llama-server --no-cache-prompt --cache-ram 0) and each alone on fresh servers; llama-server alone is stable across fresh servers but its second identical request on one server differs (logprob -1.8332 then -1.8114 on logprobs and logprobs-shape, the two values tetraeder shows). So the logits of a prompt evaluated from scratch and after reuse differ on CUDA in both engines, and which one a case sees depends on the cases before it. The own dense and moe engines run on the GPU (CUDA0 in the log, GPU memory 0 to 277 MiB). Left to do - decide the CUDA band or run those cases with reuse off in the CUDA run.'
