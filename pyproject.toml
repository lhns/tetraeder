# Tooling only (taxameter.toml and its config tests); Tetraeder itself has no Python at runtime.
[project]
name = "tetraeder-tools"
version = "0.0.0"
description = "Offline tooling for Tetraeder: Vast.ai box management through taxameter."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "taxameter"]
# SDK clients and schema validation for tests/conformance (ADR 0046)
conformance = ["openai>=1.60", "anthropic>=0.50", "jsonschema>=4", "pydantic>=2", "httpx"]

[tool.uv]
default-groups = ["dev", "conformance"]
package = false

[tool.uv.sources]
taxameter = { git = "https://github.com/lhns/taxameter", tag = "v0.3.0" }

[tool.pytest.ini_options]
testpaths = ["tests"]
