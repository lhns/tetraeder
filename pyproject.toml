# Tooling only (scripts/vastctl.py and its tests); Tetraeder itself has no Python at runtime.
[project]
name = "tetraeder-tools"
version = "0.0.0"
description = "Offline tooling for Tetraeder: Vast.ai box management."
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
