# Cases of the llama-server conformance harness (test_parity.py; ADR 0083, docs/notes/llamacpp-parity.md).
#
# id        unique name
# group     A sampling, B request and response fields, C endpoints, D libllama capabilities (the matrix groups)
# row       the exact first cell of a row of the appendix of docs/notes/llamacpp-parity.md (checked by test_parity_lib.py)
# endpoint  "METHOD /path", sent to both servers
# body      JSON request body; headers: extra request headers
# mode      status | shape | text | logprobs | stream | exact | vectors (parity_lib.compare); logprobs also takes `tolerance`
# compare_text  false: compare no streamed text; drop_events: SSE event names left out of the sequence
# paths     compare only the shape under these paths; ignore: extra paths left out of the shape
# value_paths  paths whose values must be equal (usage counts, finish_reason)
# premise   what the baseline must show or the case fails (not xfail): finish_reason
# no_model  send no `model` field (the harness adds one to every other case)
# probe     a body field derived from the baseline's answer: stop_ascii, ban_first_token (test_parity.py)
# engines   tetraeder engines the case runs on: auto (libllama on tiny-qwen3), dense (own dense builder, tiny-qwen3),
#           moe (own MoE builder, tiny-qwen3moe), llama-moe (libllama on tiny-qwen3moe); llama-server serves the same GGUF
# llama_args, tetraeder_args  extra server flags for the case
# ctx       context size of both servers (default 4096), for cases that must reach the context limit
# setup     requests sent to both servers before the compared one: [{endpoint, body}], each must answer 200
# vector_paths, tolerance  mode vectors: the numbers under these paths must match within `tolerance` (default 1e-3, parity_lib.py)
# tetraeder_refuses  TEXT: tetraeder must exit before it listens, with TEXT in its message (a pointer to what works).
#           No baseline is started and nothing is compared; endpoint, body and mode are placeholders. For flags that
#           only some engines can honour: the matrix row says what llama-server does with them
# `{tmp}` in a server argument is a directory of that server alone (slot files)
# reuse     true: the case is about prompt-cache reuse, so both servers keep it on. Every other case of mode text, logprobs
#           or stream runs with reuse off (servers.py PIN_*: tetraeder `--no-prefix-reuse --cache-ram 0`, llama-server
#           `--cache-ram 0` and `cache_prompt: false` in the request), because on CUDA the same prompt gives different
#           logits fresh and after reuse (docs/notes/llamacpp-parity.md, CUDA)
# tolerance_cuda  replaces `tolerance` when PARITY_CUDA=1 (the CUDA runs)
# expect    pass, or `gap <tree node>`: xfail(strict), flipped to pass in the change that closes the gap
#
# Tokens are compared at temperature 0 and in the seeded cases (same chain and RNG as llama-server). The tiny models are
# random, so the text is byte noise; what matters is that both servers pick the same tokens. The sampler rows that
# temperature 0 cannot show have a `seeded-*` case each. Only the random default seed has no case (it differs per
# request by design); it is covered by the sampler unit tests (crates/scheduler/src/sample.rs).
# Every appendix row has a case, a row of "Scoped out" or a row of "Covered by unit tests" in the matrix
# (test_parity_lib.py checks it, ADR 0083 decision 6).
#
# Gap cases carry what llama-server returns today; a gap must fail for the row's own reason (status, a missing
# path or different tokens), so the comparison is narrowed with `paths` where the rest already differs.

cases:
  # ---- conformant today ----
  - id: chat-greedy
    group: C
    row: "POST /chat/completions, /v1/chat/completions"
    endpoint: POST /v1/chat/completions
    body: {messages: [{role: user, content: Hello}], temperature: 0, max_tokens: 12}
    mode: text
    value_paths:
      - "choices[0].finish_reason"
      - "usage.prompt_tokens"
    engines: [auto, dense, moe]
    expect: pass

  - id: completions-greedy
    group: C
    row: "POST /v1/completions"
    endpoint: POST /v1/completions
    body: {prompt: Hello, temperature: 0, max_tokens: 12}
    mode: text
    value_paths:
      - "choices[0].finish_reason"
      - "usage.prompt_tokens"
    engines: [auto, dense, moe]
    expect: pass

  - id: completions-eos
    group: B
    row: "n_predict / max_tokens / max_completion_tokens"
    endpoint: POST /v1/completions
    body: {prompt: The, temperature: 0, max_tokens: 40}
    mode: text
    value_paths:
      - "choices[0].finish_reason"
    premise: {finish_reason: stop}
    engines: [auto, dense]
    expect: pass

  - id: chat-stream-shape
    group: B
    row: "streaming chat chunk"
    endpoint: POST /v1/chat/completions
    body: {messages: [{role: user, content: Hello}], temperature: 0, max_tokens: 12, stream: true}
    mode: stream
    engines: [auto, dense, moe]
    expect: pass

  - id: chat-stream-usage
    group: B
    row: "stream_options.include_usage"
    endpoint: POST /v1/chat/completions
    body:
      messages: [{role: user, content: Hello}]
      temperature: 0
      max_tokens: 12
      stream: true
      stream_options: {include_usage: true}
    mode: stream
    engines: [auto]
    expect: pass

  - id: stop-string
    group: B
    row: "stop"
    endpoint: POST /v1/completions
    body: {prompt: Once upon a time, temperature: 0, max_tokens: 24}
    probe: {kind: stop_ascii, length: 2, start: 3}
    mode: text
    value_paths:
      - "choices[0].finish_reason"
    engines: [auto, dense]
    expect: pass

  - id: stop-string-moe
    group: B
    row: "stop"
    endpoint: POST /v1/completions
    body: {prompt: "def f(x):", temperature: 0, max_tokens: 24}
    probe: {kind: stop_ascii, length: 2, start: 3}
    mode: text
    value_paths:
      - "choices[0].finish_reason"
    engines: [moe]
    expect: pass

  - id: max-tokens
    group: B
    row: "n_predict / max_tokens / max_completion_tokens"
    endpoint: POST /v1/chat/completions
    body: {messages: [{role: user, content: Hello}], temperature: 0, max_tokens: 5}
    mode: text
    value_paths:
      - "choices[0].finish_reason"
      - "usage.completion_tokens"
    engines: [auto, dense]
    expect: pass

  # the moe fixture writes only invalid UTF-8 for this chat prompt, so it gets a prompt with text
  - id: max-tokens-moe
    group: B
    row: "n_predict / max_tokens / max_completion_tokens"
    endpoint: POST /v1/completions
    body: {prompt: a, temperature: 0, max_tokens: 5}
    mode: text
    value_paths:
      - "choices[0].finish_reason"
      - "usage.completion_tokens"
    engines: [moe]
    expect: pass

  - id: max-completion-tokens
    group: B
    row: "n_predict / max_tokens / max_completion_tokens"
    endpoint: POST /v1/chat/completions
    body: {messages: [{role: user, content: Hello}], temperature: 0, max_completion_tokens: 5}
    mode: text
    value_paths:
      - "choices[0].finish_reason"
      - "usage.completion_tokens"
    engines: [auto]
    expect: pass

  - id: anthropic-greedy
    group: C
    row: "POST /v1/messages (Anthropic)"
    endpoint: POST /v1/messages
    headers: {anthropic-version: "2023-06-01"}
    body: {max_tokens: 8, temperature: 0, messages: [{role: user, content: Hello}]}
    mode: text
    value_paths: [stop_reason, usage.output_tokens]
    engines: [auto, dense, moe]
    expect: pass

  - id: anthropic-stream-shape
    group: C
    row: "POST /v1/messages (Anthropic)"
    endpoint: POST /v1/messages
    headers: {anthropic-version: "2023-06-01"}
    body: {max_tokens: 8, temperature: 0, stream: true, messages: [{role: user, content: Hello}]}
    mode: stream
    # llama-server drops the text deltas that carry invalid UTF-8 (the tiny model writes bytes); `ping` is optional
    compare_text: false
    drop_events: [ping]
    engines: [auto]
    expect: pass

  - id: anthropic-count-tokens
    group: C
    row: "POST /v1/messages/count_tokens"
    endpoint: POST /v1/messages/count_tokens
    headers: {anthropic-version: "2023-06-01"}
    body: {messages: [{role: user, content: Hello}]}
    mode: shape
    value_paths: [input_tokens]
    engines: [auto]
    expect: pass

  - id: usage-fields
    group: B
    row: "usage (prompt/completion/total, `prompt_tokens_details.cached_tokens`)"
    endpoint: POST /v1/chat/completions
    body: {messages: [{role: user, content: Hello}], temperature: 0, max_tokens: 6}
    mode: shape
    paths: [usage]
    value_paths: [usage.prompt_tokens, usage.completion_tokens, usage.total_tokens]
    engines: [auto, dense, moe]
    expect: pass

  - id: models-v1
    group: C
    row: "GET /models, /v1/models"
    endpoint: GET /v1/models
    mode: shape
    paths:
      - "object"
      - "data[].id"
      - "data[].object"
    engines: [auto]
    expect: pass

  - id: model-optional
    group: B
    row: "model"
    endpoint: POST /v1/chat/completions
    body: {messages: [{role: user, content: Hello}], temperature: 0, max_tokens: 3}
    no_model: true
    mode: text
    engines: [auto]
    expect: pass

  - id: usage-eos-count
    group: B
    row: "usage (prompt/completion/total, `prompt_tokens_details.cached_tokens`)"
    endpoint: POST /v1/completions
    body: {prompt: The, temperature: 0, max_tokens: 40}
    mode: shape
    paths:
      - "usage"
    value_paths:
      - "usage.completion_tokens"
      - "usage.total_tokens"
    premise: {finish_reason: stop}
    engines: [auto]
    expect: pass

  # ---- group A: sampling (visible at temperature 0 through the penalties, bias and eos handling) ----
  - id: repeat-penalty
    group: A
    row: "repeat_penalty / repeat_last_n"
    endpoint: POST /v1/completions
    body: {prompt: Once upon a time, temperature: 0, max_tokens: 30, repeat_penalty: 1.5}
    mode: text
    engines: [auto]
    expect: pass

  - id: presence-penalty
    group: A
    row: "frequency_penalty / presence_penalty (OpenAI standard names)"
    endpoint: POST /v1/completions
    body: {prompt: Once upon a time, temperature: 0, max_tokens: 30, presence_penalty: 2.0}
    mode: text
    engines: [auto]
    expect: pass

  - id: frequency-penalty
    group: A
    row: "frequency_penalty / presence_penalty (OpenAI standard names)"
    endpoint: POST /v1/completions
    body: {prompt: Once upon a time, temperature: 0, max_tokens: 30, frequency_penalty: 2.0}
    mode: text
    engines: [auto]
    expect: pass

  - id: logit-bias
    group: A
    row: "logit_bias"
    endpoint: POST /v1/completions
    body: {prompt: Once upon a time, temperature: 0, max_tokens: 12}
    probe: {kind: ban_first_token}
    mode: text
    engines: [auto]
    expect: pass

  - id: ignore-eos
    group: A
    row: "ignore_eos"
    endpoint: POST /v1/completions
    body: {prompt: The, temperature: 0, max_tokens: 40, ignore_eos: true}
    mode: text
    value_paths:
      - "choices[0].finish_reason"
      - "usage.completion_tokens"
    premise: {finish_reason: length}
    engines: [auto]
    expect: pass

  - id: seeded-sampling
    group: A
    row: "seed"
    endpoint: POST /v1/completions
    body: {prompt: Once upon a time, temperature: 0.8, top_k: 40, seed: 42, max_tokens: 30}
    mode: text
    engines: [auto]
    expect: pass

  # ---- group B: request and response fields ----
  - id: logprobs
    group: B
    row: "n_probs, logprobs, top_logprobs, post_sampling_probs"
    endpoint: POST /v1/chat/completions
    body: {messages: [{role: user, content: Hello}], temperature: 0, max_tokens: 3, logprobs: true, top_logprobs: 2}
    mode: logprobs
    engines: [auto]
    expect: pass

  - id: n-choices
    group: B
    row: "n (n_cmpl, multiple choices)"
    endpoint: POST /v1/chat/completions
    body: {messages: [{role: user, content: Hello}], temperature: 0, max_tokens: 3, n: 2}
    mode: shape
    value_paths:
      - "choices[1].index"
    engines: [auto, dense, moe]
    expect: pass

  - id: grammar-gbnf
    group: B
    row: "grammar (GBNF)"
    endpoint: POST /v1/completions
    body: {prompt: Once upon a time, temperature: 0, max_tokens: 12, grammar: "root ::= \"ab\""}
    mode: text
    engines: [auto, dense]
    expect: pass

  - id: json-schema-top-level
    group: B
    row: "json_schema (native field)"
    endpoint: POST /v1/completions
    body: {prompt: Once upon a time, temperature: 0, max_tokens: 12, json_schema: {type: object}}
    mode: text
    engines: [auto, dense]
    expect: pass

  - id: system-fingerprint
    group: B
    row: "system_fingerprint"
    endpoint: POST /v1/chat/completions
    body: {messages: [{role: user, content: Hello}], temperature: 0, max_tokens: 3}
    mode: shape
    paths:
      - "system_fingerprint"
    engines: [auto, dense, moe]
    expect: pass

  - id: timings
    group: B
    row: "timings (`prompt_n`, `prompt_ms`, `predicted_per_second`, `cache_n`, `draft_n`, ...)"
    endpoint: POST /v1/chat/completions
    body: {messages: [{role: user, content: Hello}], temperature: 0, max_tokens: 3}
    mode: shape
    paths: [timings]
    engines: [auto, dense, moe]
    expect: pass

  # ---- group C: endpoints ----
  - id: health
    group: C
    row: "GET /health, /v1/health (public, no key)"
    endpoint: GET /health
    mode: exact
    engines: [auto]
    expect: pass

  - id: metrics
    group: C
    row: "GET /metrics (Prometheus, `--metrics`)"
    endpoint: GET /metrics
    mode: status
    engines: [auto]
    expect: pass

  - id: props
    group: C
    row: "GET /props, POST /props (`--props` for POST)"
    endpoint: GET /props
    mode: status
    engines: [auto]
    expect: pass

  - id: tokenize
    group: C
    row: "POST /tokenize, /detokenize"
    endpoint: POST /tokenize
    body: {content: Hello world}
    mode: exact
    engines: [auto]
    expect: pass

  - id: detokenize
    group: C
    row: "POST /tokenize, /detokenize"
    endpoint: POST /detokenize
    body: {tokens: [39, 68, 75]}
    mode: exact
    engines: [auto]
    expect: pass

  - id: apply-template
    group: C
    row: "POST /apply-template"
    endpoint: POST /apply-template
    body: {messages: [{role: user, content: Hello}]}
    mode: exact
    engines: [auto]
    expect: pass

  - id: native-completion
    group: C
    row: "POST /completion, /completions (native, many fields)"
    endpoint: POST /completion
    body: {prompt: Once upon a time, temperature: 0, n_predict: 12}
    mode: text
    engines: [auto]
    expect: pass

  - id: models-unprefixed
    group: C
    row: "GET /models, /v1/models"
    endpoint: GET /models
    mode: status
    engines: [auto]
    expect: pass

  - id: chat-unprefixed
    group: C
    row: "POST /chat/completions, /v1/chat/completions"
    endpoint: POST /chat/completions
    body: {messages: [{role: user, content: Hello}], temperature: 0, max_tokens: 12}
    mode: text
    engines: [auto]
    expect: pass

  - id: responses
    group: C
    row: "POST /v1/responses, /responses (OpenAI Responses API)"
    endpoint: POST /v1/responses
    body: {input: Hello, max_output_tokens: 5, temperature: 0}
    mode: status
    engines: [auto]
    expect: pass

  - id: infill
    group: C
    row: "POST /infill"
    endpoint: POST /infill
    body: {input_prefix: a, input_suffix: b}
    mode: status
    engines: [auto]
    expect: pass

  - id: api-key
    group: C
    row: "API key auth (`--api-key`, Bearer)"
    endpoint: POST /v1/chat/completions
    body: {messages: [{role: user, content: Hello}], temperature: 0, max_tokens: 3}
    llama_args: [--api-key, conformance-key]
    tetraeder_args: [--api-key, conformance-key]
    mode: status
    engines: [auto]
    expect: pass

  # ---- group D: what libllama has and the gateway did not expose (ADR 0090) ----
  - id: kv-offload
    group: D
    row: "KV offload (`-nkvo`)"
    endpoint: POST /v1/completions
    body: {prompt: Hello, temperature: 0, max_tokens: 12}
    llama_args: [-nkvo]
    tetraeder_args: [--no-kv-offload]
    mode: text
    value_paths: ["choices[0].finish_reason"]
    engines: [auto]
    expect: pass

  - id: kv-offload-builders
    group: D
    row: "KV offload (`-nkvo`)"
    endpoint: POST /v1/completions
    body: {prompt: Hello}
    tetraeder_args: [--no-kv-offload]
    tetraeder_refuses: "own builders keep the KV cache"
    mode: status
    engines: [dense, moe]
    expect: pass

  - id: kv-types
    group: D
    row: "KV cache types"
    endpoint: POST /v1/completions
    body: {prompt: Hello, temperature: 0, max_tokens: 12}
    llama_args: [-ctk, q8_0, -ctv, q8_0, -fa, "on"]
    tetraeder_args: [--cache-type-k, q8_0, --cache-type-v, q8_0, --flash-attn, "on"]
    mode: text
    value_paths: ["choices[0].finish_reason"]
    engines: [auto]
    expect: pass

  - id: kv-types-builders
    group: D
    row: "KV cache types"
    endpoint: POST /v1/completions
    body: {prompt: Hello, temperature: 0, max_tokens: 4}
    llama_args: [-ctk, q8_0, -ctv, q8_0, -fa, "on"]
    tetraeder_args: [--cache-type-k, q8_0, --cache-type-v, q8_0]
    mode: status
    engines: [dense]
    expect: pass

  - id: kv-types-builders-refused
    group: D
    row: "KV cache types"
    endpoint: POST /v1/completions
    body: {prompt: Hello}
    tetraeder_args: [--cache-type-k, q5_0, --cache-type-v, q5_0]
    tetraeder_refuses: "allowed pairs"
    mode: status
    engines: [dense, moe]
    expect: pass

  - id: cpu-moe
    group: D
    row: "Tensor overrides"
    endpoint: POST /v1/completions
    body: {prompt: Hello, temperature: 0, max_tokens: 12}
    llama_args: [--cpu-moe]
    tetraeder_args: [--cpu-moe]
    mode: text
    value_paths: ["choices[0].finish_reason"]
    engines: [llama-moe]
    expect: pass

  - id: n-cpu-moe
    group: D
    row: "Tensor overrides"
    endpoint: POST /v1/completions
    body: {prompt: Hello, temperature: 0, max_tokens: 12}
    llama_args: [--n-cpu-moe, "1"]
    tetraeder_args: [--n-cpu-moe, "1"]
    mode: text
    value_paths: ["choices[0].finish_reason"]
    engines: [llama-moe]
    expect: pass

  - id: cpu-moe-builder
    group: D
    row: "Tensor overrides"
    endpoint: POST /v1/completions
    body: {prompt: Hello}
    tetraeder_args: [--cpu-moe]
    tetraeder_refuses: "--expert-slots"
    mode: status
    engines: [moe]
    expect: pass

  # The tiny models have no pooling type of their own (it is `none`), so the value cases pass --pooling mean to both.
  - id: embeddings-oai
    group: D
    row: "POST /embedding, /embeddings, /v1/embeddings (needs `--embeddings`)"
    endpoint: POST /v1/embeddings
    body: {input: Hello world}
    llama_args: [--embeddings, --pooling, mean]
    tetraeder_args: [--embeddings, --pooling, mean]
    mode: vectors
    vector_paths: ["data[0].embedding"]
    value_paths: ["usage.prompt_tokens"]
    engines: [auto]
    expect: pass

  - id: embeddings-oai-batch
    group: D
    row: "POST /embedding, /embeddings, /v1/embeddings (needs `--embeddings`)"
    endpoint: POST /v1/embeddings
    body: {input: [Hello world, Once upon a time]}
    llama_args: [--embeddings, --pooling, mean]
    tetraeder_args: [--embeddings, --pooling, mean]
    mode: vectors
    vector_paths: ["data[0].embedding", "data[1].embedding"]
    value_paths: ["usage.prompt_tokens", "data[1].index"]
    engines: [auto]
    expect: pass

  - id: embeddings-native
    group: D
    row: "POST /embedding, /embeddings, /v1/embeddings (needs `--embeddings`)"
    endpoint: POST /embeddings
    body: {content: Hello world}
    llama_args: [--embeddings, --pooling, mean]
    tetraeder_args: [--embeddings, --pooling, mean]
    mode: vectors
    vector_paths: ["[0].embedding"]
    engines: [auto]
    expect: pass

  - id: embedding-legacy-route
    group: D
    row: "POST /embedding, /embeddings, /v1/embeddings (needs `--embeddings`)"
    endpoint: POST /embedding
    body: {content: Hello world}
    llama_args: [--embeddings, --pooling, mean]
    tetraeder_args: [--embeddings, --pooling, mean]
    mode: vectors
    vector_paths: ["[0].embedding"]
    engines: [auto]
    expect: pass

  - id: embeddings-pooling-none
    group: D
    row: "POST /embedding, /embeddings, /v1/embeddings (needs `--embeddings`)"
    endpoint: POST /embeddings
    body: {content: Hello world}
    llama_args: [--embeddings]
    tetraeder_args: [--embeddings]
    mode: vectors
    vector_paths: ["[0].embedding"]
    engines: [auto]
    expect: pass

  - id: embeddings-oai-pooling-none
    group: D
    row: "POST /embedding, /embeddings, /v1/embeddings (needs `--embeddings`)"
    endpoint: POST /v1/embeddings
    body: {input: Hello world}
    llama_args: [--embeddings]
    tetraeder_args: [--embeddings]
    mode: exact
    engines: [auto]
    expect: pass

  - id: embeddings-unsupported
    group: D
    row: "POST /embedding, /embeddings, /v1/embeddings (needs `--embeddings`)"
    endpoint: POST /v1/embeddings
    body: {input: Hello}
    mode: exact
    engines: [auto, dense, moe]
    expect: pass

  - id: embeddings-builders-refused
    group: D
    row: "POST /embedding, /embeddings, /v1/embeddings (needs `--embeddings`)"
    endpoint: POST /v1/embeddings
    body: {input: Hello}
    tetraeder_args: [--embeddings]
    tetraeder_refuses: "--engine llama"
    mode: status
    engines: [dense, moe]
    expect: pass

  # The tiny models have no rank head: libllama then scores with the first value of the pooled state (softmaxed for
  # Qwen3), the same on both servers, so the scores are compared at 1e-5 (they are about 0.01). A server that is not
  # started with --reranking answers 501. One document per request: with several in one request llama-server
  # evaluates them in one batch and, on this fixture, scores a document differently from when it is alone (0.0213
  # in a batch of three, 0.0058 alone). The cause is libllama's rank pooling, which reads sequence s at n_cls_out * s
  # floats; the fixture has no classification head, so its rows are n_embd wide. tetraeder scores each alone.
  - id: rerank-jina
    group: D
    row: "POST /rerank, /reranking, /v1/rerank, /v1/reranking (`--rerank`)"
    endpoint: POST /v1/rerank
    body: {query: Hello world, documents: [The quick brown fox]}
    llama_args: [--reranking]
    tetraeder_args: [--reranking]
    mode: vectors
    vector_paths: ["results[0].relevance_score"]
    value_paths: ["results[0].index", "usage.prompt_tokens"]
    tolerance: 0.00001
    engines: [auto]
    expect: pass

  - id: rerank-tei
    group: D
    row: "POST /rerank, /reranking, /v1/rerank, /v1/reranking (`--rerank`)"
    endpoint: POST /rerank
    body: {query: Hello world, texts: [Once upon a time], return_text: true}
    llama_args: [--reranking]
