  # n_ctx 256, 300 tokens asked: only a server that shifts the context reaches them (without it both stop at the limit).
  - id: context-shift
    group: D
    row: "Context shift"
    endpoint: POST /v1/completions
    body: {prompt: Hello, temperature: 0, max_tokens: 300, ignore_eos: true}
    ctx: 256
    llama_args: [--context-shift]
    tetraeder_args: [--context-shift]
    mode: shape
    value_paths: ["choices[0].finish_reason", "usage.completion_tokens"]
    premise: {finish_reason: length}
    engines: [auto]
    expect: pass

