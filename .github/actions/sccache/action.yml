name: sccache for ggml CUDA
description: >
  sccache with a local disk cache as the CMake compiler launcher for C, C++ and CUDA, so ggml-cuda is not
  rebuilt from scratch on every run (rust-cache drops workspace crate outputs and tetraeder-ggml-sys is one).
  The directory is saved by actions/cache on main only and restored everywhere: a cache written by every
  branch is evicted within the hour by the 10 GB repository limit (measured: the Linux caches of the previous
  run were gone), while main's entry is read, and so kept fresh, by every branch. Use it only for the CUDA
  jobs: for the CPU variants it made a Linux job three times slower (no gain from other jobs' objects), and
  it must not be used with TETRAEDER_GGML_NATIVE=ON (-march=native objects would move between runner CPUs).
runs:
  using: composite
  steps:
    - uses: mozilla-actions/sccache-action@v0.0.9
    - name: Set launchers
      shell: bash
      run: |
        p=$(cygpath -m "$SCCACHE_PATH" 2>/dev/null || echo "$SCCACHE_PATH")
        d=$(cygpath -m ~/.cache/sccache-ci 2>/dev/null || echo ~/.cache/sccache-ci)
        mkdir -p "$d"
        {
          echo "SCCACHE_DIR=$d"
          echo "SCCACHE_CACHE_SIZE=2G"
          echo "CMAKE_C_COMPILER_LAUNCHER=$p"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=$p"
          echo "CMAKE_CUDA_COMPILER_LAUNCHER=$p"
        } >> "$GITHUB_ENV"
    - uses: actions/cache@v4
      if: github.ref == 'refs/heads/main'
      with:
        path: ~/.cache/sccache-ci
        key: sccache-${{ github.job }}-${{ runner.os }}-${{ github.sha }}
        restore-keys: sccache-${{ github.job }}-${{ runner.os }}-
    - uses: actions/cache/restore@v4
      if: github.ref != 'refs/heads/main'
      with:
        path: ~/.cache/sccache-ci
        key: sccache-${{ github.job }}-${{ runner.os }}-${{ github.sha }}
        restore-keys: sccache-${{ github.job }}-${{ runner.os }}-
