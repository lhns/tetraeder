name: box-image

on:
  push:
    branches: [main]
    paths:
      - vendor/PIN
      - docker/**
      - patches/**
      - rust-toolchain.toml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1
      - name: Read pin
        id: pin
        run: |
          {
            echo "tag=$(sed -n 's/^tag=//p' vendor/PIN)"
            echo "commit=$(sed -n 's/^commit=//p' vendor/PIN)"
            echo "rust=$(grep -m1 channel rust-toolchain.toml | cut -d'"' -f2)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/box/Dockerfile
          push: true
          build-args: |
            LLAMA_TAG=${{ steps.pin.outputs.tag }}
            LLAMA_COMMIT=${{ steps.pin.outputs.commit }}
            RUST_VERSION=${{ steps.pin.outputs.rust }}
          tags: |
            ghcr.io/lhns/tetraeder-box:${{ steps.pin.outputs.tag }}
            ghcr.io/lhns/tetraeder-box:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
