name: ci

on:
  push:
    # Phase and track branches get CI before they have a PR.
    branches: [main, "phase*", "track-*"]
  pull_request:
  # record_golden: only the golden-linux job runs (records the Linux golden, uploads it as an artifact).
  workflow_dispatch:
    inputs:
      record_golden:
        description: Record the Linux golden (only that job runs)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Explicit: .cargo/config.toml [env] makes local builds native (one CPU variant); CI and releases
  # build the DL multi-variant ggml (ADR 0052). A process env var wins over config [env].
  TETRAEDER_GGML_NATIVE: "OFF"

jobs:
  test:
    if: ${{ !inputs.record_golden }}
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1
      - name: Patch queue
        if: runner.os == 'Linux'
        run: bash patches/apply.sh
      - name: Patch queue
        if: runner.os == 'Windows'
        shell: pwsh
        run: patches/apply.ps1
      - name: Toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - name: libclang (bindgen)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev cmake ninja-build
      - name: libclang (bindgen)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "LIBCLANG_PATH=C:/Program Files/LLVM/bin" >> "$GITHUB_ENV"
      # Caches are saved on main only: every branch entry is evicted within the hour by the 10 GB repository
      # limit and pushes main's entries (the sccache of the CUDA jobs) out with it. Branches restore main's.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # One cmake tree for clippy, build and test: each is a separate build script run (own OUT_DIR) and
      # compiled the 14 CPU variants of ggml again (3 x 4 min on Linux).
      - name: Shared ggml build dir
        shell: bash
        run: echo "TETRAEDER_GGML_BUILD_DIR=$(cygpath -m "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")/ggml-build" >> "$GITHUB_ENV"
      # Qwen3-0.6B Q8_0 for the engine and ggml-sys tests and the golden (about 0.6 GB)
      - uses: actions/cache/restore@v4
        id: model
        with:
          path: .hf_cache
          key: model-qwen3-0.6b-q8_0
      - name: Fetch test model
        if: steps.model.outputs.cache-hit != 'true'
        shell: bash
        run: cargo xtask fetch-model
      - uses: actions/cache/save@v4
        if: steps.model.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        with:
          path: .hf_cache
          key: model-qwen3-0.6b-q8_0
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build -p tetraeder
      # Which CPU variant each runner loads (ADR 0052): tier, ISA, missing, extra, registry names.
      - name: CPU backend
        shell: bash
        run: |
          bin=target/debug/tetraeder
          [ -f "$bin.exe" ] && bin="$bin.exe"
          "$bin" info --json
      # A test that needs the model fails instead of skipping; the skipped ones are listed below.
      - name: cargo test
        shell: bash
        env:
          TETRAEDER_REQUIRE_MODELS: "1"
        run: |
          cargo test --workspace -- --nocapture --skip matches_llama_simple --skip matches_bench_golden 2>&1 | tee test.log
      # Float results differ per CPU tier (ADR 0052) and per OS, so the golden is pinned to the SSE4.2 tier and
      # recorded per OS (bench/golden/*-sse42-<os>.json; the Linux one by the golden-linux job). Goldens for
      # more tiers are a later item (docs/testing.md).
      - name: golden (SSE4.2 tier)
        shell: bash
        env:
          TETRAEDER_REQUIRE_MODELS: "1"
          TETRAEDER_GGML_CPU_VARIANT: sse42
        run: cargo test -p tetraeder-engine --test golden -- --nocapture 2>&1 | tee -a test.log
      - name: Skipped tests
        if: always()
        shell: bash
        run: |
          {
            echo "### Skipped tests (${{ runner.os }})"
            grep -a -E '^skipped?:' test.log | sort -u || echo "none"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: astral-sh/setup-uv@v5
      # SDK conformance suite (tests/conformance) against `tetraeder serve --fake`
      - name: pytest
        shell: bash
        env:
          TETRAEDER_BIN: ${{ runner.os == 'Windows' && 'target/debug/tetraeder.exe' || 'target/debug/tetraeder' }}
        run: uv run pytest -q tests
      - name: bash -n scripts
        if: runner.os == 'Linux'
        run: |
          for f in scripts/*.sh patches/*.sh; do bash -n "$f"; done
      # Both collector configs load in the pinned collector (ADR 0059): receivers, processors, env expansion.
      # The compose config reads the host through /hostfs (its container mounts /).
      - name: otelcol validate
        if: runner.os == 'Linux'
        run: |
          bash scripts/otelcol_install.sh "$RUNNER_TEMP/otelcol"
          [ -e /hostfs ] || sudo ln -s / /hostfs
          TETRAEDER_OTEL_DIR="$RUNNER_TEMP/otel" "$RUNNER_TEMP/otelcol/otelcol-contrib" validate --config=deploy/otelcol/config-file.yaml
          "$RUNNER_TEMP/otelcol/otelcol-contrib" validate --config=deploy/otelcol/config.yaml

  cuda-build:
    if: ${{ !inputs.record_golden }}
    name: cuda compile-only (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows-2022: CUDA 12.8 supports its MSVC (newer runners crash cudafe++)
        os: [ubuntu-latest, windows-2022]
    env:
      # One arch keeps the compile-only job cheap; the box image builds the full list.
      TETRAEDER_CUDA_ARCHS: "86"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1
      - name: Patch queue
        if: runner.os == 'Linux'
        run: bash patches/apply.sh
      - name: Patch queue
        if: runner.os == 'Windows'
        shell: pwsh
        run: patches/apply.ps1
      - uses: ./.github/actions/sccache
      - name: Toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - name: libclang (bindgen)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev cmake ninja-build
      - name: libclang (bindgen)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "LIBCLANG_PATH=C:/Program Files/LLVM/bin" >> "$GITHUB_ENV"
      - uses: Jimver/cuda-toolkit@v0.2.24
        with:
          cuda: "12.8.1"
          method: network
          # Linux apt names: cuBLAS ships as libcublas-*, not cuda-cublas-*.
          sub-packages: ${{ runner.os == 'Windows' && '["nvcc", "cudart", "cublas", "cublas_dev", "visual_studio_integration", "thrust"]' || '["nvcc", "cudart-dev", "cccl"]' }}
          non-cuda-sub-packages: ${{ runner.os == 'Windows' && '[]' || '["libcublas", "libcublas-dev"]' }}
      # Windows: the Visual Studio generator does not see the CUDA toolset installed by the action; Ninja in an
      # MSVC developer shell finds nvcc through CUDA_PATH.
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Ninja generator
        if: runner.os == 'Windows'
        shell: bash
        run: echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: cuda
      # Link the binary, not just the -sys crate: missing CUDA link libraries only show up here.
      - run: cargo build -p tetraeder -p tetraeder-ggml-sys -p tetraeder-model --features tetraeder-ggml-sys/cuda
      # The default build loads CUDA as a module (ADR 0052): it must exist next to the binary.
      - name: CUDA module
        shell: bash
        run: test -f target/debug/libggml-cuda.so -o -f target/debug/ggml-cuda.dll
      - name: sccache stats
        if: always()
        shell: bash
        run: '"$SCCACHE_PATH" --show-stats || true'

  vulkan-build:
    if: ${{ !inputs.record_golden }}
    name: vulkan compile-only (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1
      - name: Patch queue
        if: runner.os == 'Linux'
        run: bash patches/apply.sh
      - name: Patch queue
        if: runner.os == 'Windows'
        shell: pwsh
        run: patches/apply.ps1
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Vulkan SDK and libclang
        run: sudo apt-get update && sudo apt-get install -y libclang-dev cmake ninja-build libvulkan-dev glslc spirv-headers
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: vulkan
      - run: cargo build -p tetraeder-ggml-sys --features vulkan
      - name: Vulkan module
        run: ls -l target/debug/libggml-vulkan.so

  # The static native build stays supported (comparison arm, quick local builds). No rust-cache: a
  # native build restored on a runner with an older CPU would die with SIGILL.
  native-static:
    if: ${{ !inputs.record_golden }}
    name: native static (ubuntu-latest)
    runs-on: ubuntu-latest
    env:
      TETRAEDER_GGML_NATIVE: "ON"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1
      - name: Patch queue
        run: bash patches/apply.sh
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: libclang (bindgen)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev cmake ninja-build
      - run: cargo test -p tetraeder-ggml-sys
      - run: cargo build -p tetraeder
      - name: CPU backend
        run: target/debug/tetraeder info --json

  # AVX-512 VNNI kernels (ADR 0053, patch 0002) on a runner without the hardware: Intel SDE emulates
  # Ice Lake server. The iqk tests must run, not skip.
  avx512-sde:
    if: ${{ !inputs.record_golden }}
    name: avx512 under Intel SDE (ubuntu-latest)
    runs-on: ubuntu-latest
    env:
      SDE_URL: https://downloadmirror.intel.com/859732/sde-external-9.58.0-2025-06-16-lin.tar.xz
      SDE_SHA256: f849acecad4c9b108259c643b2688fd65c35723cd23368abe5dd64b917cc18c0
      SDE_DIR: sde-external-9.58.0-2025-06-16-lin
      TETRAEDER_GGML_CPU_VARIANT: icelake
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1
      - name: Patch queue
        run: bash patches/apply.sh
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: libclang (bindgen)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev cmake ninja-build
      - name: Intel SDE (cached tarball)
        uses: actions/cache@v4
        id: sde-cache
        with:
          path: sde.tar.xz
          key: sde-${{ env.SDE_SHA256 }}
      - name: Fetch Intel SDE
        if: steps.sde-cache.outputs.cache-hit != 'true'
        run: curl -fsSL --retry 3 -o sde.tar.xz "$SDE_URL"
      - name: Unpack Intel SDE
        run: |
          echo "$SDE_SHA256  sde.tar.xz" | sha256sum -c -
          tar -xf sde.tar.xz
          # SDE attaches with ptrace.
          sudo sysctl -w kernel.yama.ptrace_scope=0
          "$SDE_DIR/sde64" -icx -- /bin/true
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: sde
      - name: Build tests
        run: cargo test --release -p tetraeder-ggml-sys --test iqk_kernels --test ggml --test cpu_dispatch --test smoke --no-run
      - name: iqk tests, kernels on
        shell: bash
        run: |
          bin=$(find target/release/deps -maxdepth 1 -type f -name 'iqk_kernels-*' ! -name '*.d' | head -1)
          env -u GGML_CPU_IQK_MM "$SDE_DIR/sde64" -icx -- "$bin" --nocapture --test-threads=1 2>&1 | tee iqk-on.txt
          # A skip while the variant is icelake is a failure.
          if grep -q 'skipped: needs' iqk-on.txt; then echo 'iqk tests skipped'; exit 1; fi
          grep -q 'max |iqk - vec_dot|' iqk-on.txt
      - name: iqk tests, GGML_CPU_IQK_MM=0
        shell: bash
        run: |
          bin=$(find target/release/deps -maxdepth 1 -type f -name 'iqk_kernels-*' ! -name '*.d' | head -1)
          GGML_CPU_IQK_MM=0 "$SDE_DIR/sde64" -icx -- "$bin" --nocapture --test-threads=1 2>&1 | tee iqk-off.txt
          if grep -q 'skipped: needs' iqk-off.txt; then echo 'tests skipped'; exit 1; fi
      - name: ggml-sys tests under the icelake variant
        run: |
          for t in ggml cpu_dispatch smoke; do
            bin=$(find target/release/deps -maxdepth 1 -type f -name "$t-*" ! -name '*.d' | head -1)
            echo "== $t"
            "$SDE_DIR/sde64" -icx -- "$bin" --test-threads=1
          done

  # Records the Linux golden (workflow_dispatch with record_golden). Float results differ per OS (libm), so
  # the golden is per OS and CPU tier (docs/testing.md). Steps: cross-check against the Windows file (prints the
  # logits at the first flipped token), record llama-simple and our run pinned to sse42, check the new files,
  # upload them. Commit them from the artifact.
  golden-linux:
    name: record golden (ubuntu-latest)
    if: ${{ inputs.record_golden }}
    runs-on: ubuntu-latest
    env:
      TETRAEDER_GGML_CPU_VARIANT: sse42
      TETRAEDER_REQUIRE_MODELS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1
      - name: Patch queue
        run: bash patches/apply.sh
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: libclang (bindgen)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev cmake ninja-build
      - uses: actions/cache/restore@v4
        id: model
        with:
          path: .hf_cache
          key: model-qwen3-0.6b-q8_0
      - name: Fetch test model
        if: steps.model.outputs.cache-hit != 'true'
        run: cargo xtask fetch-model
      - name: Runner
        run: grep -m1 'model name' /proc/cpuinfo
      - name: Cross-check against the Windows golden
        continue-on-error: true
        env:
          TETRAEDER_GOLDEN_OS: windows
        run: cargo test -p tetraeder-engine --test golden -- --nocapture
      - name: llama-simple (sse42)
        env:
          TETRAEDER_LLAMA_TOOLS_ISA: sse42
          CMAKE_BUILD_PARALLEL_LEVEL: "4"
        run: cargo xtask llama-tools
      - name: Record
        run: cargo xtask golden
      - name: Check the new files
        run: cargo test -p tetraeder-engine --test golden -- --nocapture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-linux
          path: bench/golden/*-sse42-linux.json
