name: ci

on:
  push:
    # Phase and track branches get CI before they have a PR.
    branches: [main, "phase*", "track-*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1
      - name: Patch queue
        if: runner.os == 'Linux'
        run: bash patches/apply.sh
      - name: Patch queue
        if: runner.os == 'Windows'
        shell: pwsh
        run: patches/apply.ps1
      - name: Toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - name: libclang (bindgen)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev cmake ninja-build
      - name: libclang (bindgen)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "LIBCLANG_PATH=C:/Program Files/LLVM/bin" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build -p tetraeder
      # Which CPU variant each runner loads (ADR 0052): tier, ISA, missing, extra, registry names.
      - name: CPU backend
        shell: bash
        run: |
          bin=target/debug/tetraeder
          [ -f "$bin.exe" ] && bin="$bin.exe"
          "$bin" info --json
      - run: cargo test --workspace
      - uses: astral-sh/setup-uv@v5
      # SDK conformance suite (tests/conformance) against `tetraeder serve --fake`
      - name: pytest
        shell: bash
        env:
          TETRAEDER_BIN: ${{ runner.os == 'Windows' && 'target/debug/tetraeder.exe' || 'target/debug/tetraeder' }}
        run: uv run pytest -q tests
      - name: bash -n scripts
        if: runner.os == 'Linux'
        run: |
          for f in scripts/*.sh patches/*.sh; do bash -n "$f"; done

  cuda-build:
    name: cuda compile-only (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows-2022: CUDA 12.8 supports its MSVC (newer runners crash cudafe++)
        os: [ubuntu-latest, windows-2022]
    env:
      # One arch keeps the compile-only job cheap; the box image builds the full list.
      TETRAEDER_CUDA_ARCHS: "86"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1
      - name: Patch queue
        if: runner.os == 'Linux'
        run: bash patches/apply.sh
      - name: Patch queue
        if: runner.os == 'Windows'
        shell: pwsh
        run: patches/apply.ps1
      - name: Toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - name: libclang (bindgen)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev cmake ninja-build
      - name: libclang (bindgen)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "LIBCLANG_PATH=C:/Program Files/LLVM/bin" >> "$GITHUB_ENV"
      - uses: Jimver/cuda-toolkit@v0.2.24
        with:
          cuda: "12.8.1"
          method: network
          # Linux apt names: cuBLAS ships as libcublas-*, not cuda-cublas-*.
          sub-packages: ${{ runner.os == 'Windows' && '["nvcc", "cudart", "cublas", "cublas_dev", "visual_studio_integration", "thrust"]' || '["nvcc", "cudart-dev", "cccl"]' }}
          non-cuda-sub-packages: ${{ runner.os == 'Windows' && '[]' || '["libcublas", "libcublas-dev"]' }}
      # Windows: the Visual Studio generator does not see the CUDA toolset installed by the action; Ninja in an
      # MSVC developer shell finds nvcc through CUDA_PATH.
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Ninja generator
        if: runner.os == 'Windows'
        shell: bash
        run: echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: cuda
      # Link the binary, not just the -sys crate: missing CUDA link libraries only show up here.
      - run: cargo build -p tetraeder -p tetraeder-ggml-sys -p tetraeder-model --features tetraeder-ggml-sys/cuda
      # The default build loads CUDA as a module (ADR 0052): it must exist next to the binary.
      - name: CUDA module
        shell: bash
        run: test -f target/debug/libggml-cuda.so -o -f target/debug/ggml-cuda.dll

  vulkan-build:
    name: vulkan compile-only (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1
      - name: Patch queue
        if: runner.os == 'Linux'
        run: bash patches/apply.sh
      - name: Patch queue
        if: runner.os == 'Windows'
        shell: pwsh
        run: patches/apply.ps1
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Vulkan SDK and libclang
        run: sudo apt-get update && sudo apt-get install -y libclang-dev cmake ninja-build libvulkan-dev glslc spirv-headers
      - uses: Swatinem/rust-cache@v2
        with:
          key: vulkan
      - run: cargo build -p tetraeder-ggml-sys --features vulkan
      - name: Vulkan module
        run: ls -l target/debug/libggml-vulkan.so

  # The static native build stays supported (comparison arm, quick local builds). No rust-cache: a
  # native build restored on a runner with an older CPU would die with SIGILL.
  native-static:
    name: native static (ubuntu-latest)
    runs-on: ubuntu-latest
    env:
      TETRAEDER_GGML_NATIVE: "ON"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1
      - name: Patch queue
        run: bash patches/apply.sh
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: libclang (bindgen)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev cmake ninja-build
      - run: cargo test -p tetraeder-ggml-sys
      - run: cargo build -p tetraeder
      - name: CPU backend
        run: target/debug/tetraeder info --json

  # AVX-512 VNNI kernels (ADR 0053, patch 0002) on a runner without the hardware: Intel SDE emulates
  # Ice Lake server. The iqk tests must run, not skip.
  avx512-sde:
    name: avx512 under Intel SDE (ubuntu-latest)
    runs-on: ubuntu-latest
    env:
      SDE_URL: https://downloadmirror.intel.com/859732/sde-external-9.58.0-2025-06-16-lin.tar.xz
      SDE_SHA256: f849acecad4c9b108259c643b2688fd65c35723cd23368abe5dd64b917cc18c0
      SDE_DIR: sde-external-9.58.0-2025-06-16-lin
      TETRAEDER_GGML_CPU_VARIANT: icelake
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1
      - name: Patch queue
        run: bash patches/apply.sh
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: libclang (bindgen)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev cmake ninja-build
      - name: Intel SDE (cached tarball)
        uses: actions/cache@v4
        id: sde-cache
        with:
          path: sde.tar.xz
          key: sde-${{ env.SDE_SHA256 }}
      - name: Fetch Intel SDE
        if: steps.sde-cache.outputs.cache-hit != 'true'
        run: curl -fsSL --retry 3 -o sde.tar.xz "$SDE_URL"
      - name: Unpack Intel SDE
        run: |
          echo "$SDE_SHA256  sde.tar.xz" | sha256sum -c -
          tar -xf sde.tar.xz
          # SDE attaches with ptrace.
          sudo sysctl -w kernel.yama.ptrace_scope=0
          "$SDE_DIR/sde64" -icx -- /bin/true
      - uses: Swatinem/rust-cache@v2
        with:
          key: sde
      - name: Build tests
        run: cargo test --release -p tetraeder-ggml-sys --test iqk_kernels --test ggml --test cpu_dispatch --test smoke --no-run
      - name: iqk tests, kernels on
        shell: bash
        run: |
          bin=$(find target/release/deps -maxdepth 1 -type f -name 'iqk_kernels-*' ! -name '*.d' | head -1)
          env -u GGML_CPU_IQK_MM "$SDE_DIR/sde64" -icx -- "$bin" --nocapture --test-threads=1 2>&1 | tee iqk-on.txt
          # A skip while the variant is icelake is a failure.
          if grep -q 'skipped: needs' iqk-on.txt; then echo 'iqk tests skipped'; exit 1; fi
          grep -q 'max |iqk - vec_dot|' iqk-on.txt
      - name: iqk tests, GGML_CPU_IQK_MM=0
        shell: bash
        run: |
          bin=$(find target/release/deps -maxdepth 1 -type f -name 'iqk_kernels-*' ! -name '*.d' | head -1)
          GGML_CPU_IQK_MM=0 "$SDE_DIR/sde64" -icx -- "$bin" --nocapture --test-threads=1 2>&1 | tee iqk-off.txt
          if grep -q 'skipped: needs' iqk-off.txt; then echo 'tests skipped'; exit 1; fi
      - name: ggml-sys tests under the icelake variant
        run: |
          for t in ggml cpu_dispatch smoke; do
            bin=$(find target/release/deps -maxdepth 1 -type f -name "$t-*" ! -name '*.d' | head -1)
            echo "== $t"
            "$SDE_DIR/sde64" -icx -- "$bin" --test-threads=1
          done
