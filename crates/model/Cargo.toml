[package]
name = "tetraeder-model"
description = "Tetraeder: GGUF loading, architecture graph builders, tokenizer and chat templates."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
# Forwarded to ggml-sys: build ggml with CUDA.
cuda = ["tetraeder-ggml-sys/cuda"]

[dependencies]
tetraeder-ggml-sys = { path = "../ggml-sys" }
tetraeder-plan = { path = "../plan" }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
toml = "0.8"
opentelemetry = "0.33.1"
opentelemetry_sdk = { version = "0.33.1", features = ["testing"] }
tetraeder-telemetry = { path = "../telemetry" }
