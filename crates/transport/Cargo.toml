[package]
name = "tetraeder-transport"
description = "Tetraeder: One trait for collectives and point-to-point transfers: NCCL, RCCL, QUIC, RDMA, shared memory."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "transport-bench"
path = "src/bin/transport-bench.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
opentelemetry = "0.33.1"
# The peer's node id is the URI SAN of its certificate; rustls-webpki checks the chain against the anchors.
x509-parser = { version = "0.18", default-features = false }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["std"] }
# Reads the effective SO_SNDBUF and SO_RCVBUF back (getsockopt) and binds with explicit buffers.
socket2 = "0.6"
tracing = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
