[package]
name = "tetraeder-scheduler"
description = "Tetraeder: Continuous batching, chunked prefill, speculative decoding and priorities."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
cuda = ["tetraeder-ggml-sys/cuda", "tetraeder-model/cuda"]

[dependencies]
tetraeder-ggml-sys = { path = "../ggml-sys" }
tetraeder-model = { path = "../model" }
tetraeder-telemetry = { path = "../telemetry" }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
tetraeder-memory = { path = "../memory" }
