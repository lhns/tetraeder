# Cluster fixture (ADR 0091, step 2): the nodes of cluster_two_3090_lan on the measured WAN pair
# (bench/results/transport-wan-20261123, Connecticut to Germany, TLS 1.3). Probe curves hold the one-way
# time, half of the echo round trip: 8 KB 91 ms, 1 MB 274 to 300 ms, 32 MiB at 35 MiB/s. Prior points
# from the committed WAN set; `tetraeder cluster probe` replaces them. The link is the formula the
# curve replaces (45.5 ms, 35 MiB/s).

[[devices]]
id = "a/cpu0"
node = "a"
os = "linux"
kind = "cpu"
name = "Box CPU"
tier = "ram"
capacity_bytes = 64000000000
threads = 12
bandwidth_bytes_per_s = { value = 4.0e10, source = "prior" }
compute = { flops_per_s = 6.0e11, c0_graph_s = 3.0e-6, c0_eager_s = 3.0e-6 }

[[devices]]
id = "a/gpu0"
node = "a"
os = "linux"
kind = "gpu"
name = "RTX 3090"
tier = "vram"
capacity_bytes = 25769803776
index = 0
bandwidth_bytes_per_s = { value = 8.0e11, source = "prior" }
compute = { flops_per_s = 4.0e13, c0_graph_s = 4.0e-6, c0_eager_s = 1.5e-5 }
pcie = { gen_current = 4, width_current = 16, gen_max = 4, width_max = 16 }

[[devices]]
id = "a/nvme0"
node = "a"
os = "linux"
kind = "disk"
name = "Box NVMe"
tier = "nvme"
capacity_bytes = 2000000000000
bandwidth_bytes_per_s = { value = 5.0e9, source = "prior" }
media = "ssd"
queue_chunk_bytes = 1048576
queue_curve = [
  { depth = 1, bytes_per_s = 1.0e9 },
  { depth = 4, bytes_per_s = 3.0e9 },
  { depth = 16, bytes_per_s = 5.2e9 },
  { depth = 32, bytes_per_s = 5.4e9 },
]

[[links]]
id = "a/pcie-gpu0"
a = "a/gpu0"
b = "a/cpu0"
kind = "pcie"
alpha_s = { value = 1.5e-5, source = "prior" }
beta_bytes_per_s = { value = 2.0e10, source = "prior" }

[[links]]
