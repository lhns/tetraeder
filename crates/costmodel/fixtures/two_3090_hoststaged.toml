# 2 x RTX 3090, no peer access (Vast box), host links gen4. Priors only: the same 3090 numbers as
# crates/planner/fixtures/rtx3090_prior.toml (calibrated in bench/results/20261103/planner-moe/), a
# staged link per GPU pair (ADR 0070: twice the larger host alpha, the smaller host beta, halved in
# a shared lane group) and prior collective curves from the ring formula at 10 us and 12 GB/s.
[[devices]]
id = "cpu0"
kind = "cpu"
name = "Box CPU"
tier = "ram"
capacity_bytes = 96000000000
threads = 12
bandwidth_bytes_per_s = { value = 4.0e10, source = "prior" }
compute = { flops_per_s = 6.0e11, c0_graph_s = 3.0e-6, c0_eager_s = 3.0e-6 }

[[devices]]
id = "gpu0"
kind = "gpu"
name = "RTX 3090"
tier = "vram"
capacity_bytes = 25769803776
index = 0
bandwidth_bytes_per_s = { value = 8.0e11, source = "prior" }
compute = { flops_per_s = 4.0e13, c0_graph_s = 4.0e-6, c0_eager_s = 1.5e-5 }
pcie = { gen_current = 4, width_current = 16, gen_max = 4, width_max = 16 }

[[devices]]
id = "gpu1"
kind = "gpu"
name = "RTX 3090"
tier = "vram"
capacity_bytes = 25769803776
index = 1
