pcie = { gen_current = 4, width_current = 16, gen_max = 4, width_max = 16 }

[[links]]
id = "pcie-gpu0"
a = "gpu0"
b = "cpu0"
kind = "pcie"
alpha_s = { value = 1.5e-5, source = "prior" }
beta_bytes_per_s = { value = 2.0e+10, source = "prior" }

[[links]]
