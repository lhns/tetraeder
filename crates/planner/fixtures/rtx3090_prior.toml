# Spec-sheet prior of an RTX 3090 Vast box: the starting point of the anchor fit (ADR 0040), not a measurement.
# GPU: 936 GB/s, about 71 TFLOPS fp16 tensor; quantized matmul reaches far less, so the priors are rough.
# CPU: one socket share of a server, threads set from the container quota at scoring time.
