[package]
name = "tetraeder-planner"
description = "Tetraeder: Search, hints, explain, what-if and replanning."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "tetraeder-plan"
path = "src/bin/tetraeder-plan.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tetraeder-plan = { path = "../plan" }
tetraeder-profiler = { path = "../profiler" }

[dev-dependencies]
tetraeder-bench = { path = "../bench" }
