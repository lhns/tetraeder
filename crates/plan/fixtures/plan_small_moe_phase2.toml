# Phase 2 plan for model_small_moe.toml on crates/costmodel/fixtures/two_gpu_cpu_nvme.toml.
# Stage 0 runs layers 0..2 on gpu0. Stage 1 runs layers 2..4 on gpu1; its experts 4..8 live on
# the NVMe in IQ2_XXS and compute on the CPU, with a slot cache of 2 experts per layer on gpu1.
model = "small-moe"

[knobs]
prefill_micro_batches = 4
cuda_graphs = true

[[replicas]]

[[replicas.stages]]
layers = [0, 2]
devices = ["gpu0"]
tp = 1
ep = 1
kv = [{ device = "gpu0", bytes = 1_073_741_824 }]
workspace = [{ device = "gpu0", bytes = 268_435_456 }]

[[replicas.stages.assign]]
units = {}
home = ["gpu0"]
format = "Q8_0"

[[replicas.stages]]
layers = [2, 4]
devices = ["gpu1", "cpu0"]
tp = 1
ep = 1
kv = [{ device = "gpu1", bytes = 536_870_912 }]
expert_cache = [{ device = "gpu1", slots = 2 }]

[[replicas.stages.assign]]
units = { kinds = ["attn", "mlp", "head"] }
home = ["gpu1"]
format = "Q4_K"

[[replicas.stages.assign]]
units = { kinds = ["expert"], experts = [0, 4] }
home = ["gpu1"]
format = "Q4_K"

[[replicas.stages.assign]]
units = { kinds = ["expert"], experts = [4, 8] }
home = ["nvme0"]
compute = ["cpu0"]
format = "IQ2_XXS"
