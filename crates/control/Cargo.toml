[package]
name = "tetraeder-control"
description = "Tetraeder: Discovery, membership, failover, replanning triggers and mTLS."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
tetraeder-plan = { path = "../plan" }
tetraeder-profiler = { path = "../profiler" }
tetraeder-transport = { path = "../transport" }
tetraeder-costmodel = { path = "../costmodel" }
tetraeder-gateway = { path = "../gateway" }
tokio = { version = "1.54.1", features = ["sync", "rt"] }
tokio-util = "0.7.20"
opentelemetry = "0.33.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"

[dev-dependencies]
proptest = "1"
