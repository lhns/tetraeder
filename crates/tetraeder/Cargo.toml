[package]
name = "tetraeder"
description = "Tetraeder: LLM inference engine in Rust on a patched ggml."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
# GPU metrics through NVML (library loaded at runtime; absent GPU is fine).
nvml = ["tetraeder-telemetry/nvml"]
cuda = ["tetraeder-engine/cuda", "tetraeder-model/cuda", "tetraeder-scheduler/cuda"]
vulkan = ["tetraeder-engine/vulkan", "tetraeder-scheduler/vulkan"]

[dependencies]
anyhow = "1"
clap = { version = "4.6.7", features = ["derive"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tetraeder-analysis = { path = "../analysis" }
tetraeder-control = { path = "../control" }
tetraeder-costmodel = { path = "../costmodel" }
tetraeder-engine = { path = "../engine" }
tetraeder-model = { path = "../model" }
tetraeder-plan = { path = "../plan" }
tetraeder-gateway = { path = "../gateway" }
tetraeder-ggml-sys = { path = "../ggml-sys" }
tetraeder-planner = { path = "../planner" }
tetraeder-profiler = { path = "../profiler" }
tetraeder-scheduler = { path = "../scheduler" }
opentelemetry = "0.33.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "net", "sync", "time"] }
tokio-util = "0.7.20"
toml = "0.8"
tetraeder-telemetry = { path = "../telemetry" }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5.3", features = ["util"] }
