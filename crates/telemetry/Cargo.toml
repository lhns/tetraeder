[package]
name = "tetraeder-telemetry"
description = "Tetraeder: OpenTelemetry metrics, traces and logs, plus GPU and host metrics."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
# NVML GPU metrics; the library is loaded at runtime, so the build needs no CUDA.
nvml = ["dep:nvml-wrapper"]

[dependencies]
opentelemetry = { version = "0.33.1", features = ["metrics", "trace", "logs"] }
opentelemetry_sdk = { version = "0.33.1", features = ["metrics", "trace", "logs"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["http-proto", "reqwest-blocking-client", "metrics", "trace", "logs"] }
opentelemetry-appender-tracing = "0.33.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "registry"] }
tracing-opentelemetry = "0.34.0"
sysinfo = { version = "0.40.0", default-features = false, features = ["system", "disk"] }
nvml-wrapper = { version = "0.13.0", optional = true }
thiserror = "2"

[dev-dependencies]
opentelemetry_sdk = { version = "0.33.1", features = ["testing", "spec_unstable_metrics_views"] }
