# GPU box config for taxameter (https://github.com/lhns/taxameter), ADR 0029.
[project]
name = "tetraeder"
remote_dir = "/root/tetraeder"
state_dir = ".vast"
ssh_key = "~/.ssh/lrn_vast_ed25519"

[provider]
name = "vast"

[offers]
gpus = ["RTX 3090"]
min_vram_gb = 24
min_disk_gb = 50
min_reliability = 0.99
min_inet_mbps = 500
min_cuda = 12.8  # a host with max CUDA 12.5 left the CUDA 12.8 image stuck in loading
interruptible = false
# traffic is billed per GB (taxameter ADR 0010): rank offers by price plus the expected download spread over the box
# hours; the nightly fetches about 25 GB (8B + 30B), an exit box about 160 GB (pass --download-gb 160 to create);
# CPU-bound runs pass --min-cpu-cores 11
expected_download_gb = 25

[image]
name = "ghcr.io/lhns/tetraeder-box"
tag = "latest"
tag_file = "vendor/PIN"  # the image tag encodes both pins (<llama tag>-ik<ik_llama short commit>), so a box always matches
tag_regex = '^image_tag=(\S+)'
fallback = "nvidia/cuda:12.8.1-devel-ubuntu24.04"  # plain CUDA image; the provision hook installs the tools

[push]
# everything the box builds; tests/test_taxameter_config.py checks it against Cargo.toml and build.rs
# bench without bench/results (171 MB by 2026-11-13; a box writes its own results dir and fetch brings it back)
paths = [".cargo", "crates", "xtask", "patches", "bench/README.md", "bench/claude-code-proxy", "bench/golden",
         "bench/ledger.json", "bench/noise", "bench/prompts", "bench/quality", "bench/spec",
         # the committed results the crates' tests read by name (tests/test_taxameter_config.py)
         "bench/results/20261103/quality-qwen3-8b.json", "bench/results/20261103/quality-qwen3-30b-bf16.json",
         "bench/results/20261109-runner", "bench/results/20261102/builder-real-202732.json",
         "bench/results/20261103/partial-planner-dense", "bench/results/20261110b/claude-code-proxy/toolcall-fixtures-r2.json",
         "scripts", "docs/adr", "tests/fixtures", "tests/conformance", "vendor/PIN", "Cargo.toml",
         "deploy/otelcol",
         "Cargo.lock", "rust-toolchain.toml", "AGENTS.md"]
# vendor/llama.cpp is not pushed (about 50 MB, 55 min through the ssh proxy on 20261113e): the provision hook
# fetches the pin from upstream and applies the patch queue on the box (scripts/ensure_patches.sh)
submodules = []

[box]
# cargo/rustc/nvcc/cmake/ninja, the engine and bench binaries and test binaries (deps/) under target/, bench.sh,
# llama.cpp tools, the exit-run scripts (a long CPU-bound test once looked idle to the GPU check)
# (the [x] brackets keep the pattern from matching its own command line)
busy = '(^|/)(cargo|rustc|nvcc|cmake|ninja)( |$)|target/(release|debug)/tetraede[r]|target/(release|debug)/dep[s]/|bench[.]s[h]|(^|/)llama-|scripts/(exit_(box|run)|spec_run|session)[.]s[h]'
batch = 'nightl[y][.]sh'
batch_log = "runs/vast/nightly.log"
batch_done = "^NIGHTLY_DONE"
logs_dir = "runs/vast"
provision_hook = "scripts/box_deps.sh"
verify_hook = "scripts/box_verify.sh"

[results]
dirs = ["bench/results"]
done_marker = "DONE"
extra = ["runs/vast", "bench/golden"]
include = ["*.json", "*.jsonl", "DONE", "*.log", "*.zst"]
whole = ["bench/golden"]
exclude = ["*.gguf", "*/target/*"]

[models]
from_toml = "bench/spec/phase0.toml"  # the nightly spec lists the models it needs
from_key = "model.*.hf"

[nightly]
script = "scripts/nightly.sh"
done_line = "NIGHTLY_DONE"

[policy]
max_price_per_hour = 0.45
max_instances = 2  # per project (label), parallel tracks drive one box each with --id (taxameter ADR 0009); the account cap still applies
max_account_price_per_hour = 1.05  # raised 2026-11-10 by the user so B2 (<=0.60) can run beside a 0.45 box; all projects on the Vast account together
auto_replace = false  # an automatic replacement could start a second paid box
disk_gb = 80
nightly_wait_min = 170  # sum of the nightly.sh stage limits, phase2-baseline with gpu-moe and gap: 165
max_box_hours = 3
