# Local observability stack: OTel Collector -> VictoriaMetrics (metrics), VictoriaTraces (traces).
# Run the engine with OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318, open Grafana on :3000.
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otelcol/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    depends_on:
      - victoriametrics
      - victoriatraces

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.108.1
    command: ["-storageDataPath=/data", "-retentionPeriod=30d", "-opentelemetry.usePrometheusNaming"]
    volumes:
      - vm-data:/data
    ports:
      - "8428:8428"

  victoriatraces:
    image: victoriametrics/victoria-traces:v0.3.0
    command: ["-storageDataPath=/data", "-retentionPeriod=7d"]
    volumes:
      - vt-data:/data
    ports:
      - "10428:10428"

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_INSTALL_PLUGINS: victoriametrics-metrics-datasource
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - victoriametrics

volumes:
  vm-data:
  vt-data:
  grafana-data:
