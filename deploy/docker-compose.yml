# Local observability stack: OTel Collector -> VictoriaMetrics (metrics), VictoriaTraces (traces).
# Run the engine with OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318, open Grafana on :3000.
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otelcol/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    depends_on:
      - victoriametrics
      - victoriatraces

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.108.1
    command: ["-storageDataPath=/data", "-retentionPeriod=30d", "-opentelemetry.usePrometheusNaming"]
    volumes:
      - vm-data:/data
    ports:
      - "8428:8428"

  victoriatraces:
    image: victoriametrics/victoria-traces:v0.3.0
    command: ["-storageDataPath=/data", "-retentionPeriod=7d"]
    volumes:
      - vt-data:/data
    ports:
      - "10428:10428"

  vmalert:
    image: victoriametrics/vmalert:v1.108.1
    # No Alertmanager in the local stack: alerts are visible in vmalert's UI on :8880.
    # `tetraeder serve --plan` receives the SLO burn alerts on its admin listener (:8081, ADR 0055);
    # the container reaches it only if serve is started with `--admin 0.0.0.0:8081` (no authentication,
    # so only on a trusted network). Without it, or with serve stopped, the notifier only logs errors.
    # remoteWrite stores the recording rules of slo.yml (error ratios) so the dashboards can query them.
    command: ["-rule=/etc/alerts/*.yml", "-datasource.url=http://victoriametrics:8428", "-remoteWrite.url=http://victoriametrics:8428", "-notifier.url=http://host.docker.internal:8081"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./alerts:/etc/alerts:ro
    ports:
      - "8880:8880"
    depends_on:
      - victoriametrics

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - victoriametrics

volumes:
  vm-data:
  vt-data:
  grafana-data:
