# Gateway alert rules (Prometheus rule format, evaluated by vmalert in the compose stack).
groups:
  - name: gateway
    rules:
      # Admission sheds load: the queue is too short or the engine too slow for the traffic.
      - alert: GatewayShedding
        expr: |
          sum(rate(gen_ai_server_request_duration_seconds_count{error_type="overloaded"}[5m]))
            / sum(rate(gen_ai_server_request_duration_seconds_count[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Gateway rejects more than 5% of requests as overloaded"
      # Engine or internal failures after admission.
      - alert: GatewayInternalErrors
        expr: |
          sum(rate(gen_ai_server_request_duration_seconds_count{error_type="internal"}[5m]))
            / sum(rate(gen_ai_server_request_duration_seconds_count[5m])) > 0.01
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "More than 1% of gateway requests fail with internal errors"
      # Requests wait but the engine produces no output: a hung worker or a stuck backend.
      - alert: GatewayStalled
        expr: |
          max(tetraeder_scheduler_queue_depth) > 0
            and (sum(rate(tetraeder_tokens_total{tetraeder_token_direction="output"}[5m])) or vector(0)) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Requests are queued but the engine has produced no output tokens for 5 minutes"
      # The host RAM prefix cache drops saved sequences faster than it reuses them (ADR 0049).
      - alert: PrefixCacheThrash
        expr: |
          sum(rate(tetraeder_kv_prefix_evictions_total[15m]))
            > sum(rate(tetraeder_kv_prefix_hits_total{tetraeder_source="ram"}[15m]))
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "The prefix cache evicts more sequences than it restores; raise --cache-ram"
      # Tool calls the parser had to repair or could not parse (ADR 0051): a template or model regression.
      - alert: ToolCallFailures
        expr: |
          sum(rate(tetraeder_gateway_tool_calls_total{tetraeder_outcome=~"failed|repaired"}[30m]))
            / sum(rate(tetraeder_gateway_tool_calls_total[30m])) > 0.02
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "More than 2% of tool calls fail to parse or need repair"
