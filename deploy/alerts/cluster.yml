# Alert rules of the multi-node cluster (ADR 0091); each build step adds the rules of its component.
# Loaded by vmalert in docker-compose.yml; metric names follow -opentelemetry.usePrometheusNaming.
groups:
  - name: tetraeder-cluster
    rules:
      # Step 1 (transport): a handshake was refused, so a peer has an unknown, unpinned or expired
      # certificate, or dials the wrong node. Reasons: untrusted, unknown_node, no_identity, wrong_peer,
      # duplicate, bad_hello, handshake, tls_timeout, limit, ip_limit, peer_limit; the control code adds
      # not_leader, no_grant, bad_snapshot, bad_profile, bad_frame, bad_relay (a node that is not the
      # head or the leader used a worker, a prefix, or sent an implausible frame or graph).
      - alert: TetraederTlsRejected
        expr: sum by (reason) (increase(tetraeder_cluster_tls_rejected_total[10m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "A node refused a connection ({{ $labels.reason }})"
          description: "Handshakes were refused in the last 10 minutes. untrusted or unknown_node: a peer's certificate is not pinned in cluster.toml or its id is not listed; wrong_peer: a dial reached another node; duplicate: a second connection for one purpose; ip_limit, peer_limit, limit or tls_timeout: someone opens more half-open or open connections than a node allows; not_leader, no_grant, bad_snapshot, bad_profile, bad_frame or bad_relay: a configured node (or a process on the box) sent something it may not."

      # Step 3 (membership): a configured node has not been up for a minute. The head's monitor
      # sets tetraeder_cluster_node_up for every node of cluster.toml (0 while joining, down or
      # draining), so a node that never came up counts too.
      - alert: TetraederNodeDown
        expr: min by (node) (tetraeder_cluster_node_up) < 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Node {{ $labels.node }} is not up"
          description: "The head has not had a heartbeat answer from {{ $labels.node }} for a minute. Look at the node's daemon (tetraeder node), its certificate in cluster.toml and the link."

      # Step 3: the heartbeat round trip is far above what the probe measured, so the predictions
      # that price this link no longer hold. The baseline is set by `tetraeder cluster watch
      # --probe probe.json` (twice the one-way time of the smallest probed frame).
      - alert: TetraederLinkSlow
        expr: |
          histogram_quantile(0.5, sum by (le, node) (rate(tetraeder_cluster_heartbeat_rtt_seconds_bucket[10m])))
            > 2 * max by (node) (tetraeder_cluster_heartbeat_baseline_seconds)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "The link to {{ $labels.node }} is slower than probed"
          description: "Median heartbeat round trip above twice the probed small-frame round trip for 10 minutes. Probe the links again and replan if it persists."

      # Step 4 (pipeline): a segment of a replica across nodes runs at a speed the plan did not
      # predict. The head records the residual of the segment's own compute time against the
      # planner's decode step time for each segment (tetraeder.plan.residual, attribute segment);
      # 0.15 is the exit-test line (ADR 0091). The hops are priced by the link probe and watched
      # by TetraederLinkSlow.
      - alert: TetraederSegmentDrift
        expr: |
          histogram_quantile(0.5, sum by (le, tetraeder_segment) (rate(tetraeder_plan_residual_ratio_bucket{tetraeder_segment!=""}[10m]))) > 0.15
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Segment {{ $labels.tetraeder_segment }} is off its predicted step time"
          description: "The median residual of the segment's decode step is above 0.15 for 30 minutes, so the prediction that picked this cut no longer holds. Recalibrate the node (tetraeder cluster probe, the segment's anchors) and replan."

      # Step 5 (replicas): fewer replicas take requests than the plan has, so capacity is down and
      # the survivors carry the load. The head's router sets tetraeder_router_replicas_up when a
      # replica joins or leaves and tetraeder_router_replicas_planned at start. Requests that were
      # in flight on a lost replica count as failed (tetraeder_router_requests_total, result
      # failed_in_flight) and feed TetraederRequestsFailing and the SLO burn alerts.
      - alert: TetraederReplicaOut
        expr: max(tetraeder_router_replicas_up) < max(tetraeder_router_replicas_planned)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $value }} replicas up, fewer than the plan has"
          description: "A replica has been out of the router for 5 minutes: its node is down, its engine does not start or does not answer the probe step. Look at TetraederNodeDown, the node's daemon log (`tetraeder node`) and the replica child's stderr."

      # Step 6 (integration): a planned drain of a replica (a node told to drain, a replan) waits
      # for the replica's in-flight requests and, after the drain timeout, cuts what is left.
      # tetraeder_cluster_drain_total counts each drain by result (drained, timed_out).
      - alert: TetraederPlannedDrainTimedOut
        expr: sum(increase(tetraeder_cluster_drain_total{result="timed_out"}[1h])) > 0
        labels:
          severity: warning
        annotations:
          summary: "A planned drain cut requests that were still running"
          description: "A replica was drained for a replan or a node drain and some of its requests did not finish within the drain timeout, so they were cut. Look at the replica's request lengths and at tetraeder_replan_total (trigger node_change)."

      # Step 6 follow-up (join loop): the head keeps trying to start and connect a replica that is
      # out of the router and every try fails (tetraeder_cluster_join_attempts_total, result
      # failed; the head logs each try with its reason). A replica that loads slowly fails a few
      # times and joins; failing for ten minutes while the plan has more replicas than are up
      # means its engine does not start or does not answer.
      - alert: TetraederReplicaJoinFailing
        expr: |
          sum by (replica) (increase(tetraeder_cluster_join_attempts_total{result="failed"}[10m])) > 20
            and on () (max(tetraeder_router_replicas_up) < max(tetraeder_router_replicas_planned))
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Replica {{ $labels.replica }} keeps failing to join"
          description: "The head has tried to start and connect replica {{ $labels.replica }} more than 20 times in 10 minutes without success. Read the log lines with join attempt failed for the reason, then the node's daemon log and the replica child's stderr."

