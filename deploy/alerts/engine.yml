# Component alerts for hard engine failures (docs/plan.md "Alerts"). SLO burn-rate alerts are in slo.yml (ADR 0042).
# Client-caused outcomes of the gateway (cancelled, invalid_request, not_found, overloaded) are not engine failures;
# overloaded has its own alert in gateway.yml.
# Loaded by vmalert in docker-compose.yml; metric names follow -opentelemetry.usePrometheusNaming.
groups:
  - name: tetraeder-engine
    rules:
      - alert: TetraederRequestsFailing
        expr: sum by (error_type) (rate(gen_ai_server_request_duration_seconds_count{error_type!="", error_type!~"cancelled|invalid_request|not_found|overloaded"}[5m])) > 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Engine requests failing ({{ $labels.error_type }})"
          description: "Requests end with error.type {{ $labels.error_type }} for 5 minutes; check the engine log (decode or load errors)."
      # Prefetch (ADR 0038) reads experts the router mostly does not choose: disk bandwidth wasted, no step time saved.
      - alert: TetraederPrefetchAccuracyLow
        expr: |
          sum(rate(tetraeder_expert_prefetch_accuracy_ratio_sum{tetraeder_prefetch_depth="1"}[10m])) / sum(rate(tetraeder_expert_prefetch_accuracy_ratio_count{tetraeder_prefetch_depth="1"}[10m])) < 0.4
            and on() sum(rate(tetraeder_expert_prefetch_total{tetraeder_result="issued"}[10m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Expert prefetch predicts fewer than 40% of the routed experts"
          description: "Turn LoadOptions::prefetch off, or check the model: wasted prefetch bytes compete with the reads of the step."
      # Expert reads under compute (ADR 0054). With overlap on, the main thread should wait for under 70% of a layer step's
      # read span. Few chunks in flight (tetraeder_io_inflight) means the I/O workers are starved by the CPU quota: lower
      # prefetch_threads. Many in flight means the disk is saturated: grow the RAM tier (ADR 0050 c).
      - alert: TetraederExpertReadsNotHidden
        expr: |
          histogram_quantile(0.5, sum by (le) (rate(tetraeder_moe_read_hidden_ratio_bucket[10m]))) < 0.3
            and on() sum(rate(tetraeder_io_inflight_count[10m])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Decode waits for most of its expert reads (hidden share below 30%)"
          description: "The median share of a layer step's read span hidden behind compute is below 0.3 for 15 minutes. Check chunks in flight on the Expert reads under compute panel: low means starved workers, high means a saturated disk."
      # Conversion cache (ADR 0047). The first load of a plan converts every tensor, which is expected. Misses again in the
      # last hour, after misses earlier in the day and no hit in 24 hours, mean the cache is not reused: the directory is
      # not persistent, not writable, or the source file changes between loads (the key hashes its header, length and mtime).
      - alert: TetraederConvertCacheNeverHits
        expr: |
          sum(increase(tetraeder_convert_cache_total{tetraeder_result="miss"}[1h])) > 0
            and on() sum(increase(tetraeder_convert_cache_total{tetraeder_result="miss"}[24h])) > sum(increase(tetraeder_convert_cache_total{tetraeder_result="miss"}[1h]))
            and on() (sum(increase(tetraeder_convert_cache_total{tetraeder_result="hit"}[24h])) or vector(0)) == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Format conversions keep missing the cache"
          description: "Tensors were converted again in the last hour and no load found a cache file in 24 hours. Every start pays the full conversion time; check LoadOptions::convert_cache (or TETRAEDER_CACHE_DIR) is a persistent, writable directory and that the model file is not replaced between loads."
      # Speculative decoding (ADR 0043): rejected drafts still cost verify rows and expert reads.
      - alert: TetraederSpecAcceptanceLow
        expr: |
          sum by (tetraeder_spec_method) (rate(tetraeder_spec_accepted_total[10m])) / sum by (tetraeder_spec_method) (rate(tetraeder_spec_drafted_total[10m])) < 0.3
            and on(tetraeder_spec_method) sum by (tetraeder_spec_method) (rate(tetraeder_spec_drafted_total[10m])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Speculative decoding ({{ $labels.tetraeder_spec_method }}) accepts fewer than 30% of its drafts"
          description: "Drafts are issued but mostly rejected, so verify steps cost more than they save; switch the drafter off or shorten the draft length."
      # CPU backend dispatch (ADR 0052): the engine started on a lower ISA variant than the host supports.
      - alert: TetraederCpuVariantBelowHost
        expr: max(tetraeder_cpu_isa_missing) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "The CPU backend lacks features the host CPU has"
          description: "Modules missing next to the binary or TETRAEDER_GGML_CPU_VARIANT set; check `tetraeder info`. IQK_MM (ADR 0053) counts as a host feature on AVX-512 VNNI CPUs."
      # Low-bit KV (ADR 0050 b). The cache holds a fixed number of tokens; a sequence past it fails with "context full".
      - alert: TetraederKvNearFull
        expr: max by (tetraeder_device) (tetraeder_kv_tokens) / max by (tetraeder_device) (tetraeder_kv_capacity) > 0.95
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "KV cache above 95% of its token capacity"
          description: "Requests are about to fail with context full. Raise n_ctx, or use a smaller KV format (the plan's kv_format) to hold more tokens in the same bytes."
