[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/lhns/tetraeder"
rust-version = "1.95"

[workspace.lints.rust]
# unsafe is allowed only in ggml-sys and memory (AGENTS.md rule 7); those crates override this.
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
